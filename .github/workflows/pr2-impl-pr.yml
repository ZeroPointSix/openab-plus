name: PR2 Agent Profiles PR Bootstrap

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

jobs:
  implement:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
      - name: Decode existing bootstrap payload
        run: |
          python - <<'PYCODE'
          import base64
          import gzip
          import pathlib
          import re

          workflow = pathlib.Path('.github/workflows/pr2-impl-bootstrap.yml').read_text()
          match = re.search(r'data = """([A-Za-z0-9+/=]+)"""', workflow)
          if not match:
              raise SystemExit('PR2 bootstrap payload not found')
          pathlib.Path('scripts').mkdir(exist_ok=True)
          pathlib.Path('scripts/pr2_impl_bootstrap.py').write_bytes(
              gzip.decompress(base64.b64decode(match.group(1)))
          )
          PYCODE
      - name: Apply PR2 implementation
        run: |
          python scripts/pr2_impl_bootstrap.py
          rm -f .github/workflows/pr2-impl-pr.yml
      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit PR2 implementation
        run: |
          git config user.name "openab-pr2-bot"
          git config user.email "actions@github.com"
          git add Cargo.toml Cargo.lock crates/openab-core/Cargo.toml crates/openab-core/src/lib.rs crates/openab-core/src/acp/mod.rs crates/openab-core/src/agent_profile.rs crates/openab-core/src/profile_store.rs crates/openab-core/src/acp/profile_pool.rs crates/openab-gateway/Cargo.toml crates/openab-gateway/src/lib.rs crates/openab-gateway/src/agent_profile_admin.rs .github/workflows/pr2-impl-bootstrap.yml .github/workflows/pr2-impl-pr.yml scripts/pr2_impl_bootstrap.py
          git commit -m "feat(pr2): implement agent profiles" || exit 0
          git push
      - name: Core profile tests
        run: |
          cargo test -p openab-core agent_profile
          cargo test -p openab-core profile_store
      - name: Gateway check
        run: cargo check -p openab-gateway --no-default-features
