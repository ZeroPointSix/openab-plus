name: PR2 Review Fix V2

on:
  push:
    branches:
      - feat/pr2-agent-profiles
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-pr2-review-gaps-v2:
    if: ${{ github.event_name == 'push' || (github.event.pull_request.head.ref == 'feat/pr2-agent-profiles' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/pr2-agent-profiles
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply review fixes with ambient call-site patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_workflow = Path(".github/workflows/pr2-review-fix.yml").read_text()
          start = old_workflow.index("          from pathlib import Path")
          end = old_workflow.index("          PY\n\n      - name: Format", start)
          embedded = old_workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          exec(compile(script, "pr2-review-fix.yml:embedded-python", "exec"))

          ambient = Path("crates/openab-core/src/ambient.rs")
          text = ambient.read_text()
          old = "target.ensure_session(&session_key, None).await"
          new = "target.ensure_session(&session_key, None, None, None).await"
          if old not in text:
              raise RuntimeError("ambient ensure_session call-site not found")
          ambient.write_text(text.replace(old, new, 1))
          PY

      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Validate focused PR2 changes
        run: |
          cargo test -p openab-core agent_profile
          cargo test -p openab-core directives
          cargo test -p openab-core dispatch
          cargo check -p openab-gateway --no-default-features

      - name: Commit review fixes and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/pr2-review-fix.yml .github/workflows/pr2-review-fix-v2.yml
          git add Cargo.toml Cargo.lock crates/openab-core/Cargo.toml crates/openab-gateway/Cargo.toml \
            crates/openab-core/src/directives.rs crates/openab-core/src/adapter.rs \
            crates/openab-core/src/dispatch.rs crates/openab-core/src/ambient.rs \
            crates/openab-core/src/agent_profile.rs crates/openab-core/src/acp/profile_pool.rs \
            crates/openab-gateway/src/agent_profile_admin.rs \
            .github/workflows/pr2-review-fix.yml .github/workflows/pr2-review-fix-v2.yml
          if git diff --cached --quiet; then
            echo "No PR2 review-fix changes to commit"
            exit 0
          fi
          git commit -m "fix(pr2): address agent profile review gaps"
          git push origin HEAD:feat/pr2-agent-profiles
