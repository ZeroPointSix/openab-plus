name: PR2 Agent Profiles Bootstrap

on:
  push:
    branches:
      - feat/pr2-agent-profiles
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, 'feat(pr2): implement agent profiles') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode PR2 bootstrap
        run: |
          mkdir -p scripts
          python - <<'PYCODE'
          import base64, gzip, pathlib
          data = """"""
          pathlib.Path("scripts/pr2_impl_bootstrap.py").write_bytes(gzip.decompress(base64.b64decode(data)))
          PYCODE
      - name: Apply PR2 implementation
        run: python scripts/pr2_impl_bootstrap.py
      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit PR2 implementation
        run: |
          git config user.name "openab-pr2-bot"
          git config user.email "actions@github.com"
          git add Cargo.toml Cargo.lock crates/openab-core/Cargo.toml crates/openab-core/src/lib.rs crates/openab-core/src/acp/mod.rs crates/openab-core/src/agent_profile.rs crates/openab-core/src/profile_store.rs crates/openab-core/src/acp/profile_pool.rs crates/openab-gateway/Cargo.toml crates/openab-gateway/src/lib.rs crates/openab-gateway/src/agent_profile_admin.rs .github/workflows/pr2-impl-bootstrap.yml scripts/pr2_impl_bootstrap.py
          git commit -m "feat(pr2): implement agent profiles" || exit 0
          git push
      - name: Core profile tests
        run: |
          cargo test -p openab-core agent_profile
          cargo test -p openab-core profile_store
      - name: Gateway check
        run: cargo check -p openab-gateway --no-default-features
