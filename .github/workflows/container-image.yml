name: Publish Container Image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Docker BUILD_MODE argument"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - unified
      features:
        description: "Optional Cargo feature list passed through Docker FEATURES"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}"
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@1583c0f09d26c58c59d25b0eef29792b7ce99d9a # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BUILD_MODE=${{ github.event.inputs.build_mode || 'default' }}
            FEATURES=${{ github.event.inputs.features || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
