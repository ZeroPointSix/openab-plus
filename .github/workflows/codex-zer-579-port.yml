name: Codex ZER-579 port

on:
  push:
    branches:
      - codex/zer-579-acp-websocket
    paths:
      - .github/workflows/codex-zer-579-port.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  statuses: write

concurrency:
  group: codex-zer-579-port
  cancel-in-progress: false

jobs:
  port:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'codex/zer-579-acp-websocket'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: codex/zer-579-acp-websocket
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Mark port pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha || github.sha }} -f state=pending -f context='ZER-579 port' -f description='Applying upstream ACP WebSocket change'
      - name: Apply upstream ACP WebSocket change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name codexweb
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add openab-upstream https://github.com/openabdev/openab.git
          git fetch --no-tags openab-upstream main refs/pull/1418/head
          git diff --binary 2e3292bc3e3e01f0fb203dc38003ad4c9afc7ca5 c0cb2f1f564aedd6b5f11e001dd6d0001f414437 -- \
            .github/workflows/ci.yml \
            Cargo.lock Cargo.toml \
            crates/openab-core/Cargo.toml \
            crates/openab-core/src/adapter.rs \
            crates/openab-core/src/format.rs \
            crates/openab-gateway/Cargo.toml \
            crates/openab-gateway/schemas/acp-v1.schema.json \
            crates/openab-gateway/src/adapters/acp_schema.rs \
            crates/openab-gateway/src/adapters/acp_server.rs \
            crates/openab-gateway/src/adapters/mod.rs \
            crates/openab-gateway/src/lib.rs \
            docs/acp-official-methods.md \
            docs/adr/acp-server-websocket-base.md \
            docs/adr/acp-server-websocket-mcp-browser.md \
            docs/adr/acp-server-websocket.md \
            docs/canary-tests.md \
            scripts/acp-ws-smoke.py \
            src/main.rs src/unified_adapter.rs > /tmp/zer-579.patch
          git apply --3way --index /tmp/zer-579.patch
          perl -0pi -e 's/(\[package\]\nname = "openab"\nversion = )"0\.9\.9"/${1}"0.9.10"/' Cargo.toml
          perl -0pi -e 's/(\[package\]\nname = "openab-core"\nversion = )"0\.8\.13"/${1}"0.8.14"/' crates/openab-core/Cargo.toml
          perl -0pi -e 's/(\[package\]\nname = "openab-gateway"\nversion = )"0\.5\.9"/${1}"0.5.10"/' crates/openab-gateway/Cargo.toml
          cargo metadata --format-version 1 --no-deps > /dev/null
          git rm .github/workflows/codex-zer-579-port.yml
          git add .
          git commit -m "feat: port ACP WebSocket server (ZER-579)"
          git push origin HEAD:codex/zer-579-acp-websocket
      - name: Mark port success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha || github.sha }} -f state=success -f context='ZER-579 port' -f description='Upstream ACP WebSocket change applied'
