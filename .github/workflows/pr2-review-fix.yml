          replace_once(
              "crates/openab-gateway/src/agent_profile_admin.rs",
              "async fn validate_profile(\n    headers: HeaderMap,\n",
              "async fn get_default_profile(headers: HeaderMap, service: Arc<AgentProfileService>) -> Response {\n    if let Err(err) = authorize(&headers) {\n        return auth_error_response(err);\n    }\n    match service.list().await {\n        Ok(document) => Json(DefaultProfile {\n            default_profile: document.default_profile,\n        })\n        .into_response(),\n        Err(e) => internal_error(e),\n    }\n}\n\nasync fn set_default_profile(\n    headers: HeaderMap,\n    Json(request): Json<SetDefaultRequest>,\n    service: Arc<AgentProfileService>,\n) -> Response {\n    set_default_common(headers, request.profile_id, service).await\n}\n\nasync fn set_default_profile_path(\n    headers: HeaderMap,\n    Path(profile_id): Path<String>,\n    service: Arc<AgentProfileService>,\n) -> Response {\n    set_default_common(headers, Some(profile_id), service).await\n}\n\nasync fn clear_default_profile(headers: HeaderMap, service: Arc<AgentProfileService>) -> Response {\n    set_default_common(headers, None, service).await\n}\n\nasync fn set_default_common(\n    headers: HeaderMap,\n    profile_id: Option<String>,\n    service: Arc<AgentProfileService>,\n) -> Response {\n    if let Err(err) = authorize(&headers) {\n        return auth_error_response(err);\n    }\n    let profile_id = profile_id.and_then(|id| {\n        let id = id.trim().to_string();\n        if id.is_empty() {\n            None\n        } else {\n            Some(id)\n        }\n    });\n    match service.set_default(profile_id).await {\n        Ok(document) => Json(document).into_response(),\n        Err(e) if e.to_string().contains(\"invalid default profile\") => (\n            StatusCode::BAD_REQUEST,\n            Json(json!({ \"error\": e.to_string() })),\n        )\n            .into_response(),\n        Err(e) => internal_error(e),\n    }\n}\n\nasync fn validate_profile(\n    headers: HeaderMap,\n",
          )
          replace_once(
              "crates/openab-gateway/src/agent_profile_admin.rs",
              "#[derive(Serialize)]\nstruct Deleted {\n",
              "#[derive(Deserialize)]\nstruct SetDefaultRequest {\n    profile_id: Option<String>,\n}\n\n#[derive(Serialize)]\nstruct DefaultProfile {\n    default_profile: Option<String>,\n}\n\n#[derive(Serialize)]\nstruct Deleted {\n",
          )
          PY

      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Validate focused PR2 changes
        run: |
          cargo test -p openab-core agent_profile
          cargo test -p openab-core directives
          cargo test -p openab-core dispatch
          cargo check -p openab-gateway --no-default-features

      - name: Commit review fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/pr2-review-fix.yml
          git add Cargo.toml Cargo.lock crates/openab-core/Cargo.toml crates/openab-gateway/Cargo.toml \
            crates/openab-core/src/directives.rs crates/openab-core/src/adapter.rs \
            crates/openab-core/src/dispatch.rs crates/openab-core/src/agent_profile.rs \
            crates/openab-core/src/acp/profile_pool.rs crates/openab-gateway/src/agent_profile_admin.rs \
            .github/workflows/pr2-review-fix.yml
          if git diff --cached --quiet; then
            echo "No PR2 review-fix changes to commit"
            exit 0
          fi
          git commit -m "fix(pr2): address agent profile review gaps"
          git push origin HEAD:feat/pr2-agent-profiles
