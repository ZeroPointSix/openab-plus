name: PR2 Review Fix

on:
  push:
    branches:
      - feat/pr2-agent-profiles
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-pr2-review-gaps:
    if: ${{ github.event_name == 'push' || (github.event.pull_request.head.ref == 'feat/pr2-agent-profiles' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/pr2-agent-profiles
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise RuntimeError(f"{path}: expected snippet not found")
              write(path, text.replace(old, new, 1))

          def regex_replace_once(path, pattern, replacement, flags=0):
              text = read(path)
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{path}: expected regex match not found: {pattern}")
              write(path, new_text)

          # Version bump for this code change.
          replace_once("Cargo.toml", 'version = "0.9.1"', 'version = "0.9.2"')
          replace_once("crates/openab-core/Cargo.toml", 'version = "0.8.6"', 'version = "0.8.7"')
          replace_once("crates/openab-gateway/Cargo.toml", 'version = "0.5.5"', 'version = "0.5.6"')

          # Control directives can now include digits in keys, e.g. [[profile_config_top_p:0.8]].
          replace_once(
              "crates/openab-core/src/directives.rs",
              r'Regex::new(r"^\s*\[\[([a-z_]+):([^\]]*)\]\]").unwrap()',
              r'Regex::new(r"^\s*\[\[([a-z][a-z0-9_]*):([^\]]*)\]\]").unwrap()',
          )

          # AdapterRouter: parse safe profile directives and send them into the profile-aware pool.
          replace_once(
              "crates/openab-core/src/adapter.rs",
              "use anyhow::Result;\nuse async_trait::async_trait;\nuse serde::Serialize;\nuse std::sync::Arc;\n",
              "use anyhow::Result;\nuse async_trait::async_trait;\nuse serde::Serialize;\nuse std::collections::HashMap;\nuse std::sync::Arc;\n",
          )
          replace_once(
              "crates/openab-core/src/adapter.rs",
              "use crate::acp::{classify_notification, parse_turn_result, AcpEvent, ContentBlock, SessionPool, TurnResult};\n",
              "use crate::acp::{classify_notification, parse_turn_result, AcpEvent, ContentBlock, SessionPool, TurnResult};\nuse crate::agent_profile::ProfileSessionOverrides;\n",
          )
          replace_once(
              "crates/openab-core/src/adapter.rs",
              "pub struct MessageContext {\n    pub thread_channel: ChannelRef,\n    pub sender_json: String,\n    pub prompt: String,\n    pub extra_blocks: Vec<ContentBlock>,\n    pub trigger_msg: MessageRef,\n    pub other_bot_present: bool,\n}\n\n/// Sender identity injected into prompts for downstream agent context.\n",
              "pub struct MessageContext {\n    pub thread_channel: ChannelRef,\n    pub sender_json: String,\n    pub prompt: String,\n    pub extra_blocks: Vec<ContentBlock>,\n    pub trigger_msg: MessageRef,\n    pub other_bot_present: bool,\n}\n\n/// Convert safe session directives into profile selection data.\n///\n/// Chat input is allowed to select a profile and override ACP config options\n/// for the new session. Process-level controls such as command, args, env, and\n/// working_dir intentionally stay out of this path; workspace selection keeps\n/// using the existing validated `[[ws:...]]` directive.\npub(crate) fn profile_session_from_metadata(\n    raw: &HashMap<String, String>,\n) -> (Option<String>, Option<ProfileSessionOverrides>) {\n    fn first_non_empty(raw: &HashMap<String, String>, keys: &[&str]) -> Option<String> {\n        keys.iter()\n            .filter_map(|key| raw.get(*key))\n            .map(|value| value.trim())\n            .find(|value| !value.is_empty())\n            .map(ToString::to_string)\n    }\n\n    let profile_id = first_non_empty(raw, &[\"profile\", \"agent_profile\"]);\n    let mut overrides = ProfileSessionOverrides::default();\n    overrides.model = first_non_empty(raw, &[\"profile_model\", \"model\"]);\n    overrides.reasoning_effort = first_non_empty(\n        raw,\n        &[\"profile_reasoning_effort\", \"reasoning_effort\"],\n    );\n\n    for (key, value) in raw {\n        let value = value.trim();\n        if value.is_empty() {\n            continue;\n        }\n        if let Some(config_key) = key.strip_prefix(\"profile_config_\") {\n            let config_key = config_key.trim();\n            if !config_key.is_empty() {\n                overrides\n                    .config_options\n                    .insert(config_key.to_string(), value.to_string());\n            }\n        }\n    }\n\n    let has_overrides = overrides.model.is_some()\n        || overrides.reasoning_effort.is_some()\n        || !overrides.config_options.is_empty();\n\n    (profile_id, has_overrides.then_some(overrides))\n}\n\n/// Sender identity injected into prompts for downstream agent context.\n",
          )
          replace_once(
              "crates/openab-core/src/adapter.rs",
              "        tracing::debug!(platform = adapter.platform(), \"processing message\");\n\n        let content_blocks =\n            Self::pack_arrival_event(&ctx.sender_json, &ctx.prompt, ctx.extra_blocks);\n\n        let thread_key = format!(\n            \"{}:{}\",\n            adapter.platform(),\n            ctx.thread_channel\n                .thread_id\n                .as_deref()\n                .unwrap_or(&ctx.thread_channel.channel_id)\n        );\n\n        if let Err(e) = self.pool.get_or_create(&thread_key, None).await {\n            let msg = format_user_error(&e.to_string());\n            let _ = adapter\n                .send_message(&ctx.thread_channel, &format!(\"⚠️ {msg}\"))\n                .await;\n            error!(\"pool error: {e}\");\n            return Err(e);\n        }\n",
              "        tracing::debug!(platform = adapter.platform(), \"processing message\");\n\n        let MessageContext {\n            thread_channel,\n            sender_json,\n            prompt,\n            extra_blocks,\n            trigger_msg,\n            other_bot_present,\n        } = ctx;\n\n        let parse_result = crate::directives::parse_directives(&prompt);\n        let has_session_directives = !parse_result.metadata.raw.is_empty();\n        let (profile_id, profile_overrides) =\n            profile_session_from_metadata(&parse_result.metadata.raw);\n\n        let thread_key = format!(\n            \"{}:{}\",\n            adapter.platform(),\n            thread_channel\n                .thread_id\n                .as_deref()\n                .unwrap_or(&thread_channel.channel_id)\n        );\n\n        let created_now = match self\n            .pool\n            .get_or_create_with_profile(\n                &thread_key,\n                None,\n                profile_id.as_deref(),\n                profile_overrides.as_ref(),\n            )\n            .await\n        {\n            Ok(created) => created,\n            Err(e) => {\n                let msg = format_user_error(&e.to_string());\n                let _ = adapter\n                    .send_message(&thread_channel, &format!(\"⚠️ {msg}\"))\n                    .await;\n                error!(\"pool error: {e}\");\n                return Err(e);\n            }\n        };\n\n        let prompt = if created_now && has_session_directives {\n            parse_result.prompt\n        } else {\n            prompt\n        };\n        let content_blocks = Self::pack_arrival_event(&sender_json, &prompt, extra_blocks);\n",
          )
          adapter_path = Path("crates/openab-core/src/adapter.rs")
          adapter_text = adapter_path.read_text()
          adapter_text = adapter_text.replace("ctx.trigger_msg.clone()", "trigger_msg.clone()")
          adapter_text = adapter_text.replace("&ctx.thread_channel", "&thread_channel")
          adapter_text = adapter_text.replace("ctx.other_bot_present", "other_bot_present")
          adapter_path.write_text(adapter_text)
          replace_once(
              "crates/openab-core/src/adapter.rs",
              "#[cfg(test)]\nmod tests {\n    use super::*;\n",
              "#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn profile_metadata_converts_to_safe_session_overrides() {\n        let parsed = crate::directives::parse_directives(\n            \"[[profile:deep]] [[model:gpt-5.1]] [[reasoning_effort:high]] [[profile_config_mode:review]]\\nhello\",\n        );\n        let (profile_id, overrides) = profile_session_from_metadata(&parsed.metadata.raw);\n        let overrides = overrides.expect(\"expected session overrides\");\n\n        assert_eq!(profile_id.as_deref(), Some(\"deep\"));\n        assert_eq!(overrides.model.as_deref(), Some(\"gpt-5.1\"));\n        assert_eq!(overrides.reasoning_effort.as_deref(), Some(\"high\"));\n        assert_eq!(\n            overrides.config_options.get(\"mode\").map(String::as_str),\n            Some(\"review\")\n        );\n        assert_eq!(parsed.prompt, \"hello\");\n    }\n",
          )

          # Dispatcher: propagate profile directives into ensure_session / SessionPool.
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "use crate::acp::ContentBlock;\nuse crate::adapter::{AdapterRouter, ChannelRef, ChatAdapter, MessageRef};\n",
              "use crate::acp::ContentBlock;\nuse crate::adapter::{profile_session_from_metadata, AdapterRouter, ChannelRef, ChatAdapter, MessageRef};\nuse crate::agent_profile::ProfileSessionOverrides;\n",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "    async fn ensure_session(&self, session_key: &str, working_dir: Option<&str>) -> Result<bool>;\n",
              "    async fn ensure_session(\n        &self,\n        session_key: &str,\n        working_dir: Option<&str>,\n        profile_id: Option<&str>,\n        overrides: Option<&ProfileSessionOverrides>,\n    ) -> Result<bool>;\n",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "    async fn ensure_session(&self, session_key: &str, working_dir: Option<&str>) -> Result<bool> {\n        self.pool().get_or_create(session_key, working_dir).await\n    }\n",
              "    async fn ensure_session(\n        &self,\n        session_key: &str,\n        working_dir: Option<&str>,\n        profile_id: Option<&str>,\n        overrides: Option<&ProfileSessionOverrides>,\n    ) -> Result<bool> {\n        self.pool()\n            .get_or_create_with_profile(session_key, working_dir, profile_id, overrides)\n            .await\n    }\n",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "    let parse_result = batch\n        .first()\n        .map(|first_msg| crate::directives::parse_directives(&first_msg.prompt));\n\n    // Tentatively resolve [[ws:...]]",
              "    let parse_result = batch\n        .first()\n        .map(|first_msg| crate::directives::parse_directives(&first_msg.prompt));\n    let (profile_id, profile_overrides) = parse_result\n        .as_ref()\n        .map(|pr| profile_session_from_metadata(&pr.metadata.raw))\n        .unwrap_or_else(|| (None, None));\n\n    // Tentatively resolve [[ws:...]]",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "        .ensure_session(&session_key, workspace_override.as_deref())\n        .await\n",
              "        .ensure_session(\n            &session_key,\n            workspace_override.as_deref(),\n            profile_id.as_deref(),\n            profile_overrides.as_ref(),\n        )\n        .await\n",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "    struct RecordedDispatch {\n        block_count: usize,\n        other_bot_present: bool,\n        dispatch_channel: ChannelRef,\n    }\n\n    /// Mock `DispatchTarget`",
              "    struct RecordedDispatch {\n        block_count: usize,\n        other_bot_present: bool,\n        dispatch_channel: ChannelRef,\n        texts: Vec<String>,\n    }\n\n    #[derive(Clone)]\n    struct RecordedEnsure {\n        profile_id: Option<String>,\n        overrides: Option<ProfileSessionOverrides>,\n    }\n\n    /// Mock `DispatchTarget`",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "        reactions: ReactionsConfig,\n        calls: Mutex<Vec<RecordedDispatch>>,\n        /// If set",
              "        reactions: ReactionsConfig,\n        calls: Mutex<Vec<RecordedDispatch>>,\n        ensure_calls: Mutex<Vec<RecordedEnsure>>,\n        /// If set",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "                reactions: ReactionsConfig::default(),\n                calls: Mutex::new(Vec::new()),\n                ensure_err",
              "                reactions: ReactionsConfig::default(),\n                calls: Mutex::new(Vec::new()),\n                ensure_calls: Mutex::new(Vec::new()),\n                ensure_err",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "        fn calls(&self) -> Vec<RecordedDispatch> {\n            self.calls.lock().unwrap().clone()\n        }\n    }\n\n    #[async_trait]\n",
              "        fn calls(&self) -> Vec<RecordedDispatch> {\n            self.calls.lock().unwrap().clone()\n        }\n\n        fn ensure_calls(&self) -> Vec<RecordedEnsure> {\n            self.ensure_calls.lock().unwrap().clone()\n        }\n    }\n\n    #[async_trait]\n",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "        async fn ensure_session(\n            &self,\n            _session_key: &str,\n            _working_dir: Option<&str>,\n        ) -> Result<bool> {\n            if let Some(msg) = self.ensure_err.lock().unwrap().take() {\n                return Err(anyhow::anyhow!(msg));\n            }\n            Ok(true)\n        }\n",
              "        async fn ensure_session(\n            &self,\n            _session_key: &str,\n            _working_dir: Option<&str>,\n            profile_id: Option<&str>,\n            overrides: Option<&ProfileSessionOverrides>,\n        ) -> Result<bool> {\n            self.ensure_calls.lock().unwrap().push(RecordedEnsure {\n                profile_id: profile_id.map(ToString::to_string),\n                overrides: overrides.cloned(),\n            });\n            if let Some(msg) = self.ensure_err.lock().unwrap().take() {\n                return Err(anyhow::anyhow!(msg));\n            }\n            Ok(true)\n        }\n",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "            self.calls.lock().unwrap().push(RecordedDispatch {\n                block_count: content_blocks.len(),\n                other_bot_present,\n                dispatch_channel: thread_channel.clone(),\n            });\n",
              "            let texts = content_blocks\n                .iter()\n                .filter_map(|block| match block {\n                    ContentBlock::Text { text } => Some(text.clone()),\n                    ContentBlock::Image { .. } => None,\n                })\n                .collect();\n            self.calls.lock().unwrap().push(RecordedDispatch {\n                block_count: content_blocks.len(),\n                other_bot_present,\n                dispatch_channel: thread_channel.clone(),\n                texts,\n            });\n",
          )
          replace_once(
              "crates/openab-core/src/dispatch.rs",
              "    #[tokio::test]\n    async fn consumer_dispatches_single_message_as_one_batch() {\n",
              "    #[tokio::test]\n    async fn consumer_passes_profile_directives_to_session_creation() {\n        let mock = Arc::new(MockDispatchTarget::new());\n        let target: Arc<dyn DispatchTarget> = mock.clone();\n        let adapter: Arc<dyn ChatAdapter> = Arc::new(MockChatAdapter);\n        let (tx, rx) = tokio::sync::mpsc::channel::<BufferedMessage>(1);\n        tx.send(make_msg(\n            \"[[profile:deep]] [[model:gpt-5.1]] [[reasoning_effort:high]] [[profile_config_approval_policy:never]]\\nhello\",\n            10,\n        ))\n        .await\n        .unwrap();\n        drop(tx);\n\n        consumer_loop(\n            \"mock:T\".into(),\n            make_channel(\"T\"),\n            rx,\n            target,\n            adapter,\n            10,\n            24_000,\n            Duration::from_secs(60),\n        )\n        .await;\n\n        let ensure_calls = mock.ensure_calls();\n        assert_eq!(ensure_calls.len(), 1);\n        assert_eq!(ensure_calls[0].profile_id.as_deref(), Some(\"deep\"));\n        let overrides = ensure_calls[0]\n            .overrides\n            .as_ref()\n            .expect(\"expected profile overrides\");\n        assert_eq!(overrides.model.as_deref(), Some(\"gpt-5.1\"));\n        assert_eq!(overrides.reasoning_effort.as_deref(), Some(\"high\"));\n        assert_eq!(\n            overrides.config_options.get(\"approval_policy\").map(String::as_str),\n            Some(\"never\")\n        );\n\n        let calls = mock.calls();\n        assert_eq!(calls.len(), 1);\n        assert!(calls[0].texts.iter().any(|text| text == \"hello\"));\n        assert!(!calls[0]\n            .texts\n            .iter()\n            .any(|text| text.contains(\"[[profile:\")));\n    }\n\n    #[tokio::test]\n    async fn consumer_dispatches_single_message_as_one_batch() {\n",
          )

          # Agent profile service: expose live-session config option conversion and rename fallback source.
          replace_once(
              "crates/openab-core/src/agent_profile.rs",
              "    pub fn config_schema(&self, agent_type: &str) -> AgentConfigSchema {\n        let mut models = BTreeSet::new();\n",
              "    pub fn config_schema_from_options(\n        agent_type: &str,\n        options: &[crate::acp::protocol::ConfigOption],\n    ) -> AgentConfigSchema {\n        let fields = options\n            .iter()\n            .map(|option| AgentConfigField {\n                id: option.id.clone(),\n                label: option.name.clone(),\n                kind: option.option_type.clone(),\n                options: option\n                    .options\n                    .iter()\n                    .map(|value| value.value.clone())\n                    .collect(),\n                dynamic: true,\n            })\n            .collect();\n\n        AgentConfigSchema {\n            agent_type: agent_type.to_string(),\n            source: \"agent-session-config-options\".into(),\n            generated_at: Utc::now(),\n            fields,\n        }\n    }\n\n    pub fn config_schema(&self, agent_type: &str) -> AgentConfigSchema {\n        let mut models = BTreeSet::new();\n",
          )
          replace_once(
              "crates/openab-core/src/agent_profile.rs",
              '            source: "agent-profile-service".into(),\n',
              '            source: "profile-store-fallback".into(),\n',
          )
          replace_once(
              "crates/openab-core/src/agent_profile.rs",
              "        let schema = resolver.config_schema(\"codex\");\n\n        assert!(schema.fields.iter().any(|field| field.id == \"model\"\n",
              "        let schema = resolver.config_schema(\"codex\");\n\n        assert_eq!(schema.source, \"profile-store-fallback\");\n        assert!(schema.fields.iter().any(|field| field.id == \"model\"\n",
          )
          replace_once(
              "crates/openab-core/src/agent_profile.rs",
              "    fn capability_schema_is_profile_derived() {\n",
              "    fn capability_schema_can_reflect_live_config_options() {\n        let options = vec![crate::acp::protocol::ConfigOption {\n            id: \"model\".into(),\n            name: \"Model\".into(),\n            description: Some(\"AI model selection\".into()),\n            category: Some(\"model\".into()),\n            option_type: \"enum\".into(),\n            current_value: \"gpt-5\".into(),\n            options: vec![crate::acp::protocol::ConfigOptionValue {\n                value: \"gpt-5\".into(),\n                name: \"GPT-5\".into(),\n                description: None,\n            }],\n        }];\n\n        let schema = AgentCapabilityResolver::config_schema_from_options(\"codex\", &options);\n\n        assert_eq!(schema.source, \"agent-session-config-options\");\n        assert_eq!(schema.fields.len(), 1);\n        assert_eq!(schema.fields[0].id, \"model\");\n        assert_eq!(schema.fields[0].label, \"Model\");\n        assert_eq!(schema.fields[0].kind, \"enum\");\n        assert_eq!(schema.fields[0].options, vec![\"gpt-5\".to_string()]);\n        assert!(schema.fields[0].dynamic);\n    }\n\n    #[test]\n    fn capability_schema_is_profile_derived() {\n",
          )

          # SessionPool: provide a session-aware schema helper for callers that have a live thread id.
          replace_once(
              "crates/openab-core/src/acp/profile_pool.rs",
              "    pub async fn get_config_options(&self, thread_id: &str) -> Vec<ConfigOption> {\n        match self.existing_pool(thread_id).await {\n            Some(pool) => pool.get_config_options(thread_id).await,\n            None => Vec::new(),\n        }\n    }\n\n    pub async fn set_config_option(\n",
              "    pub async fn get_config_options(&self, thread_id: &str) -> Vec<ConfigOption> {\n        match self.existing_pool(thread_id).await {\n            Some(pool) => pool.get_config_options(thread_id).await,\n            None => Vec::new(),\n        }\n    }\n\n    pub async fn config_schema_for_thread(\n        &self,\n        thread_id: &str,\n        agent_type: &str,\n    ) -> Option<crate::agent_profile::AgentConfigSchema> {\n        let options = self.get_config_options(thread_id).await;\n        if options.is_empty() {\n            None\n        } else {\n            Some(crate::agent_profile::AgentCapabilityResolver::config_schema_from_options(\n                agent_type,\n                &options,\n            ))\n        }\n    }\n\n    pub async fn set_config_option(\n",
