[package]
name = "codeg-facade"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
percent-encoding = "2"
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["fs"] }
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
